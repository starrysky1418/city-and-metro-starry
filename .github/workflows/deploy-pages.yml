name: Deploy to Cloudflare Pages

# 备选部署通道：默认关闭。
# 推荐做法是在 Cloudflare Dashboard 用 "Connect to Git" 直接绑定本仓库，
# 那样每次 push 都会自动构建，无需本工作流、也无需任何凭据。
# 仅当不便使用 Git 集成时，才启用本工作流做直传部署。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 需在仓库 Settings → Secrets and variables → Actions 中：
    #   Variables: CF_DIRECT_UPLOAD = true
    #   Secrets:   CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
    # 未设置变量时整个任务跳过，不会与 Cloudflare Git 集成重复部署，也不会产生失败记录。
    if: ${{ vars.CF_DIRECT_UPLOAD == 'true' }}
    steps:
      - name: 检查 Cloudflare 凭据
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID，请在仓库 Secrets 中配置。"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 发布到 Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy . --project-name city-and-metro-starry --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
